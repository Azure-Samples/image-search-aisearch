<!DOCTYPE html>
<html>
<head>
    <meta name="color-scheme" content="light dark">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 340px;
            width: 700px;
        }
        #carousel {
            position: relative;
            width: 680px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #frame {
            width: 580px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
        }
        #frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(128,128,128,0.5);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .nav:disabled { opacity: 0.2; cursor: default; }
        #prev { left: 0; }
        #next { right: 0; }
        #counter {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: gray;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div id="carousel">
        <button class="nav" id="prev" type="button" aria-label="Previous image">&#8249;</button>
        <div id="frame"></div>
        <button class="nav" id="next" type="button" aria-label="Next image">&#8250;</button>
        <span id="counter" aria-live="polite"></span>
    </div>
    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";

        const app = new App({ name: "Image Viewer", version: "1.0.0" });

        let images = [];
        let index = 0;

        const frame = document.getElementById("frame");
        const prevBtn = document.getElementById("prev");
        const nextBtn = document.getElementById("next");
        const counter = document.getElementById("counter");

        function show(i) {
            index = i;
            const img = images[index];
            frame.innerHTML = "";
            const el = document.createElement("img");
            el.src = `data:${img.mimeType || "image/jpeg"};base64,${img.data}`;
            el.alt = "Blob image";
            frame.appendChild(el);
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === images.length - 1;
            counter.textContent = images.length > 1 ? `${index + 1} / ${images.length}` : "";
        }

        prevBtn.addEventListener("click", () => { if (index > 0) show(index - 1); });
        nextBtn.addEventListener("click", () => { if (index < images.length - 1) show(index + 1); });

        app.ontoolresult = ({ content }) => {
            images = (content || []).filter((block) => block.type === "image");
            if (images.length > 0) show(0);
        };

        await app.connect();
    </script>
</body>
</html>
