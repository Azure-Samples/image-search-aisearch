name: ai-chat-app-hack-vision
services:
  aca:
    project: ./app/backend
    language: py
    host: containerapp
    docker:
      remoteBuild: true
  mcp:
    project: ./app/backend
    language: py
    host: containerapp
    docker:
      path: ./Dockerfile.mcp
      remoteBuild: true
hooks:
  prepackage:
    shell: pwsh
    run: cd ./app/frontend;npm install;npm run build
    interactive: true
    continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/setup_search_service.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: ./scripts/setup_search_service.sh
      interactive: true
      continueOnError: false
metadata:
  template: image-search-aisearch@0.0.1-beta
